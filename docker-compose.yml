  #   restart: unless-stopped
  #   command: celery -A app.celery_app worker --loglevel=info
  #   env_file:
  #     - .env
  #   depends_on:
  #     - redis
  #     - postgres
  #   networks:
  #     - civiclens_network

  # ----------------------------------------------------------------------------
  # FUTURE EXTENSION PLACEHOLDER: Nginx reverse proxy
  # ----------------------------------------------------------------------------
  # nginx:
  #   image: nginx:stable-alpine
  #   container_name: civiclens_nginx
  #   restart: unless-stopped
