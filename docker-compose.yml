 # ==============================================================================
# CivicLens AI Backend - Docker Compose Configuration
# ==============================================================================
# Usage:
#   docker compose up -d --build     # Start services
#   docker compose logs -f backend   # Tail backend logs
#   docker compose down              # Stop services
#   docker compose down -v           # Stop and remove volumes (wipes DB data)
# ==============================================================================

version: "3.9"

# ------------------------------------------------------------------------------
# SERVICES
# ------------------------------------------------------------------------------
services:

  # ----------------------------------------------------------------------------
  # FASTAPI BACKEND SERVICE
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: civiclens-ai-backend:latest
    container_name: civiclens_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override host to use the internal Docker network service name
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ASYNC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for local development hot-reload (remove in strict prod)
      - ./:/app
      # Persist uploaded files and logs outside the container
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - civiclens_network

  # ----------------------------------------------------------------------------
  # POSTGRESQL DATABASE SERVICE
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: civiclens_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      # Named volume for persistent database storage
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - civiclens_network

  # ----------------------------------------------------------------------------
  # FUTURE EXTENSION PLACEHOLDER: Redis (caching / Celery broker)
