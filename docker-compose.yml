# ------------------------------------------------------------------------------
# NETWORKS
# ------------------------------------------------------------------------------
networks:
  civiclens_network:
    driver: bridge
    name: civiclens_network

# ------------------------------------------------------------------------------
# VOLUMES
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: civiclens_postgres_data
  uploads_data:
    name: civiclens_uploads_data
  logs_data:
    name: civiclens_logs_data
